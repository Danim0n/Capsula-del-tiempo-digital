name: capsula_del_tiempo_digital
description: "Una cápsula del tiempo privada, local y cifrada."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  drift: ^2.31.0
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^5.1.0
  gal: ^2.3.3
  go_router: ^17.2.3
  image_picker: ^1.2.2
  intl: ^0.20.2
  just_audio: ^0.10.6
  lottie: ^3.5.1
  path: ^1.9.1
  path_provider: ^2.1.5
  record: ^6.2.1
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.42
  timezone: ^0.10.1
  uuid: ^4.6.0
  video_player: ^2.10.1
  tutorial_coach_mark: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  drift_dev: ^2.31.0
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/memory_hero.png
    - assets/images/covers/
    - assets/animations/giftbox_open.lottie
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
